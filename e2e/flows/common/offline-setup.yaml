# Offline first run: Get started -> Essential -> import every file in Downloads
# (only files; subfolders like Download/places/ are not picked) -> wait for the index.
appId: ${APP_ID || "team.sopa.aoair.offline"}
---
- launchApp
- tapOn: "Get started"
- tapOn:
    text: "Essential, .*"
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- assertVisible: "Import the files"
- tapOn: "Choose files"
- tapOn: "Show roots"
- tapOn: "Downloads"
- tapOn: "List view"
- longPressOn:
    text: ".*\\.gguf"
- tapOn: "More options"
- tapOn: "Select all"
- tapOn: "Select"
- extendedWaitUntil:
    visible: "Everything runs offline from now on."
    timeout: ${SETUP_TIMEOUT || 900000}
