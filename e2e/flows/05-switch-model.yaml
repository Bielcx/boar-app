# Switch the answer model to another installed one. On a 4 GB phone only switch to
# a model that fits (the 4B was killed by lmkd on a 3.8 GB emulator, CR-1).
appId: ${APP_ID || "team.sopa.aoair"}
name: switch model
---
- launchApp
- runFlow: common/open-settings.yaml
- tapOn: "Models"
- scrollUntilVisible:
    element: "Use for answers"
- tapOn: "Use for answers"
- extendedWaitUntil:
    visible:
      text: ".* now writes your answers"
    timeout: 120000
- back
- back
- runFlow:
    file: common/ask.yaml
    env:
      QUESTION: "What is a Merkle tree?"
- takeScreenshot: shots/05-switched-model-answer
