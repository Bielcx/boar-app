# Open the last answer's source list ("Sources (N)" / group "Source 1: ...").
appId: ${APP_ID || "team.sopa.aoair.offline"}
---
- scrollUntilVisible:
    element:
      text: "${T_SOURCES}.*"
    optional: true
- tapOn:
    text: "${T_SOURCES}.*"
    index: 0
    optional: true
- takeScreenshot: perf-sources-open
